[project]
name = "dify-datasource-webdav"
version = "0.0.2"
description = "Browse and ingest files from any WebDAV server into a Knowledge base"
readme = "README.md"
requires-python = ">=3.12"

dependencies = [
    "dify_plugin>=0.11.0,<0.12.0",
    "requests>=2.32",
    "lxml>=5.0",]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
